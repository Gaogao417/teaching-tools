            if (!Number.isFinite(deltaMs)) {
                return "首次记录已生成";
            }
            if (Math.abs(deltaMs) < 50) {
                return "表现保持稳定";
            }
            return deltaMs < 0 ? "完成效率提升" : "再练一轮可继续刷新";
        }

        function openMeaningSummaryOverlay(snapshot) {
            if (!state.session) {
                return;
            }
            state.session.meaningSummaryOpen = true;
            state.resultSnapshot = snapshot;
            rerenderModernOnly();
        }

        function generateProblem(groupId) {
            if (groupId === "meaning") {
                return generateMeaningProblem();
            }
            if (groupId === "ratioToSide") {
                return generateRatioToSideProblem();
            }
            return generateGuidedSolveProblem();
        }

        function generateMeaningProblem() {
            const trig = shuffle(["sin", "cos", "tan", "cot"])[0];
            const referenceAngle = shuffle(ACUTE_ANGLES)[0];
            const roles = ROLE_BY_TRIG[trig];
            return {
                kind: "meaning",
                trig,
                referenceAngle,
                targetText: trigWithAngle(trig, referenceAngle),
                roles,
                selectedRoles: [],
                solved: false,
                wrongAttempts: 0,
                startedAt: null,
                completedAt: null,
                elapsedMs: null,
                firstTryCorrect: false,
                localHints: LOCAL_HINTS.meaning,
                hintUsed: 0,
                hintVisible: false,
                prompt: `请先选出 ${trigWithAngle(trig, referenceAngle)} 的分子边，再选分母边。`
            };
        }

        function showMeaningHint() {
            const problem = currentProblem();
            const session = state.session;
            if (!problem || problem.kind !== "meaning") {
                return;
            }
            if (problem.hintUsed >= 2) {
                if (session.groupId === "meaning") {
                    return;
                }
                setFeedback("hint", "提示已用完", "本题已展示 2 次提示，请先自行完成。");
                return;
            }
            problem.hintUsed += 1;
            problem.hintVisible = true;
            if (session.groupId === "meaning") {
                rerenderModernOnly();
            } else {
                rerenderQuestionOnly();
            }
        }

        function generateRatioToSideProblem() {
            const trig = shuffle(["sin", "cos", "tan", "cot"])[0];
            const referenceAngle = shuffle(ACUTE_ANGLES)[0];
            const triple = shuffle(TRIPLE_BANK)[0];
            const { numerator, denominator } = computeRatioPair(triple, trig, referenceAngle);
            return {
                kind: "ratioToSide",
                trig,
                referenceAngle,
                ratioText: `${trigWithAngle(trig, referenceAngle)} = ${numerator}/${denominator}`,
                numerator,
                denominator,
                triple,
                layout: pickTriangleLayout(),
                edgeInputs: {
                    AB: "",
                    BC: "",
                    AC: ""
                },
                edgeErrors: {
                    AB: false,
                    BC: false,
                    AC: false
                },
                expectedSides: Object.fromEntries(Object.entries(triple).map(([side, value]) => [side, formatLength(value)])),
                inlineStatus: {
                    type: "idle",
                    message: "填写完成后按 Enter 提交"
                },
                solved: false,
                wrongAttempts: 0,
                startedAt: null,
                completedAt: null,
                elapsedMs: null,
                firstTryCorrect: false,
                localHints: LOCAL_HINTS.ratioToSide,
                prompt: `根据 ${trigWithAngle(trig, referenceAngle)} 推断三边长度，并填写到图上。`
            };
        }

        function generateGuidedSolveProblem() {
            const triple = shuffle(TRIPLE_BANK)[0];
            const referenceAngle = shuffle(ACUTE_ANGLES)[0];
            const knownType = shuffle(["sin", "cos", "tan", "cot"])[0];
            const target = shuffle(["sin", "cos", "tan", "cot"].filter((item) => item !== knownType))[0];
            const knownRoles = ROLE_BY_TRIG[knownType];
            const targetRoles = ROLE_BY_TRIG[target];
            const thirdRole = ["opposite", "adjacent", "hypotenuse"].find((role) => !knownRoles.includes(role));
            const difficulty = state.settings.guidedDifficulty === "hard" ? "hard" : "simple";
            const scalePool = difficulty === "hard" ? GUIDED_HARD_SCALE_BANK : GUIDED_SIMPLE_SCALE_BANK;
            const scale = shuffle(scalePool)[0];
            const finalNumerator = formatLength(triple[getSideForRole(referenceAngle, targetRoles[0])]);
            const finalDenominator = formatLength(triple[getSideForRole(referenceAngle, targetRoles[1])]);
            const givenKnown = {
                [knownRoles[0]]: formatScaledLength(triple[getSideForRole(referenceAngle, knownRoles[0])], scale.n, scale.d),
                [knownRoles[1]]: formatScaledLength(triple[getSideForRole(referenceAngle, knownRoles[1])], scale.n, scale.d)
            };
            return {
                kind: "guidedSolve",
                layout: pickTriangleLayout(),
                referenceAngle,
                knownType,
                knownRoles,
                baseTriple: { ...triple },
                actualKnown: {
                    [knownRoles[0]]: formatLength(triple[getSideForRole(referenceAngle, knownRoles[0])]),
                    [knownRoles[1]]: formatLength(triple[getSideForRole(referenceAngle, knownRoles[1])])
                },
                zRoles: {
                    [knownRoles[0]]: formatLength(triple[getSideForRole(referenceAngle, knownRoles[0])]),
                    [knownRoles[1]]: formatLength(triple[getSideForRole(referenceAngle, knownRoles[1])])
                },
                givenKnown,
                target,
                thirdRole,
                thirdZ: formatLength(triple[getSideForRole(referenceAngle, thirdRole)]),
                final: `${finalNumerator}/${finalDenominator}`,
                steps: {
                    mark: { value: "已知边已锁定到图形", done: true },
                    ratio: { value: "", done: false },
                    third: { value: "", done: false },
                    final: { value: "", done: false }
                },
                markTargets: {
                    opposite: "",
                    adjacent: "",
                    hypotenuse: ""
                },
                selectedKnownToken: null,
                ratioInputs: Object.fromEntries(Object.keys({
                    [knownRoles[0]]: true,
                    [knownRoles[1]]: true
                }).map((role) => [role, ""])),
                ratioErrors: Object.fromEntries(Object.keys({
                    [knownRoles[0]]: true,
                    [knownRoles[1]]: true
                }).map((role) => [role, false])),
                thirdInput: "",
                thirdError: false,
                finalInputs: {
                    numerator: "",
                    denominator: ""
                },
                finalErrors: {
                    numerator: false,
                    denominator: false
                },
                solved: false,
                wrongAttempts: 0,
                startedAt: null,
                completedAt: null,
                elapsedMs: null,
                firstTryCorrect: false,
                localHints: LOCAL_HINTS.guidedSolve,
                prompt: `已知 ${trigWithAngle(knownType, referenceAngle)} 对应的两边长度（可能是合数或分数），按步骤求 ${trigWithAngle(target, referenceAngle)}。`
            };
        }

        function currentProblem() {
            return state.session.problems[state.session.index];
        }

        function renderPlay() {
            const session = state.session;
            if (!session) {
                return;
            }
            const problem = currentProblem();
            renderPlayModern(problem, session);
        }

        function renderPlayModern(problem, session) {
            const playScreen = document.getElementById("play-screen");
            const practiceShell = playScreen.querySelector(".practice-shell");
            if (!practiceShell) return;
            practiceShell.innerHTML = renderModernShell(problem, session);
            bindModernEvents(problem);
        }

        function renderModernShell(problem, session) {
            const progressDots = session.problems.map((_, idx) => {
                let cls = "pending";
                if (idx < session.index) cls = "done";
                if (idx === session.index) cls = "active";
                return `<div class="modern-progress-dot ${cls}"></div>`;
            }).join("");
            const firstTry = computeFirstTryAccuracy(session.problems.slice(0, session.index + (problem.solved ? 1 : 0)));
            const overlay = session.meaningSummaryOpen ? renderMeaningCompletionOverlay(state.resultSnapshot) : "";
            return `
                <div class="modern-shell ${session.meaningSummaryOpen ? "summary-open" : ""}">
                    <div class="modern-shell-frame">
                        <div class="modern-topbar">
                            <div class="modern-header-actions">
                                <button type="button" class="modern-header-btn" id="modern-back-btn">返回首页</button>
                                <button type="button" class="modern-header-btn restart" id="modern-restart-btn">重新开始本组</button>
                                ${renderModernPageConfig(session)}
                            </div>
                            <div class="modern-progress-panel">
                                <div class="modern-progress-header">
                                    <div class="modern-progress-dots">${progressDots}</div>
                                    <div class="modern-progress-label">第 ${session.index + 1} / ${session.problems.length} 题</div>
                                </div>
                                <div class="modern-mini-stats">
                                    <div class="modern-mini-stat"><span>当前耗时</span><strong id="modern-live-timer">${formatSeconds(session.elapsedMs)}</strong></div>
                                    <div class="modern-mini-stat"><span>本组最佳</span><strong>${formatSeconds(bestForGroup(session.groupId))}</strong></div>
                                    <div class="modern-mini-stat"><span>首次答对率</span><strong>${Math.round(firstTry.ratio * 100)}%</strong></div>
                                </div>
                            </div>
                        </div>
                        <div class="modern-main-card">
                            <div class="modern-canvas">
                                <div class="modern-canvas-hint">
                                    <div class="modern-canvas-hint-dot"></div>
                                    ${buildActionBanner(problem)}
                                </div>
                                <div class="modern-svg-container">
                                    ${renderModernTriangleSvg(problem)}
                                </div>
                            </div>
                            <div class="modern-interaction-panel">
                                ${renderModernPanel(problem, session)}
                                ${renderModernFooter(problem, session)}
                            </div>
                        </div>
                        ${renderModernSuccessToast(problem, session)}
                        <div class="practice-modal-mount" id="score-modal-mount" aria-hidden="true"></div>
                    </div>
                    ${overlay}
                </div>
            `;
        }

        function renderModernPageConfig(session) {
            if (!session || session.groupId !== "guidedSolve") {
                return "";
            }
            const guidedDifficulty = state.settings.guidedDifficulty === "hard" ? "hard" : "simple";
            return `
                <div class="modern-page-config" role="radiogroup" aria-label="第 3 组难度">
                    <div class="modern-difficulty-head">第 3 组难度</div>
                    <div class="modern-difficulty-options">
                        <label class="modern-difficulty-option">
                            <input type="radio" name="guided-difficulty" value="simple" ${guidedDifficulty === "simple" ? "checked" : ""}>
                            <span class="modern-difficulty-pill">简单 · 整数倍</span>
                        </label>
                        <label class="modern-difficulty-option">
                            <input type="radio" name="guided-difficulty" value="hard" ${guidedDifficulty === "hard" ? "checked" : ""}>
                            <span class="modern-difficulty-pill">高难 · 分数倍</span>
                        </label>
                    </div>
                    <div class="modern-difficulty-note">仅影响后续新题。</div>
                </div>
            `;
        }

        function currentGuidedStepKey(problem) {
            return ["mark", "ratio", "third", "final"].find((name) => !problem.steps[name].done) || "final";
        }

        function renderModernPanel(problem, session) {
            if (problem.kind === "meaning") {
                const trigUpper = problem.trig.toUpperCase();
                const numeratorValue = problem.selectedRoles[0]
                    ? `${ROLE_LABELS[problem.selectedRoles[0]]} (${getSideForRole(problem.referenceAngle, problem.selectedRoles[0])})`
                    : "分子边 ?";
                const denominatorValue = problem.selectedRoles[1]
                    ? `${ROLE_LABELS[problem.selectedRoles[1]]} (${getSideForRole(problem.referenceAngle, problem.selectedRoles[1])})`
                    : "分母边 ?";
                const focusCopy = problem.selectedRoles.length === 0 ? "先点分子边" : "再点分母边";
                return `
                    <div class="modern-panel-stage group-1">
                        <div class="modern-exercise-header">
                            <span class="modern-exercise-label">第 1 组</span>
                            <h2 class="modern-exercise-title">求 <span class="modern-exercise-target">${trigUpper} ${problem.referenceAngle}</span></h2>
                        </div>
                        <div class="modern-fraction-card">
                            <div class="modern-fraction-label">${trigUpper} ${problem.referenceAngle} =</div>
                            <div class="modern-fraction-stack">
                                <div class="modern-fraction-btn ${problem.selectedRoles.length === 0 ? "active-numerator" : ""} ${problem.selectedRoles[0] ? "filled" : "empty"}">${numeratorValue}</div>
                                <div class="modern-fraction-bar"></div>
                                <div class="modern-fraction-btn ${problem.selectedRoles.length === 1 ? "active-denominator" : ""} ${problem.selectedRoles[1] ? "filled" : "empty"}">${denominatorValue}</div>
                            </div>
                        </div>
                        <div class="modern-focus-line">${focusCopy === "先点分子边" ? "先选择分子边" : "再选择分母边"}</div>
                        ${renderModernHintArea(problem)}
                    </div>
                `;
            }
            if (problem.kind === "ratioToSide") {
                return `
                    <div class="modern-panel-stage group-2">
                        <div class="modern-exercise-header">
                            <span class="modern-exercise-label">第 2 组</span>
                            <h2 class="modern-exercise-title">题目：<span class="modern-exercise-target">${escapeHtml(problem.ratioText)}</span></h2>
                        </div>
                        <div class="modern-angle-chip">参考角 ${problem.referenceAngle}</div>
                        <div class="modern-focus-line">填写三边长度，可用 Tab 切换输入框，Enter 提交</div>
                        ${renderModernHintArea(problem)}
                    </div>
                `;
            }
            const stepKey = currentGuidedStepKey(problem);
            const knownText = problem.knownRoles
                .map((role) => `${getSideForRole(problem.referenceAngle, role)}=${(problem.givenKnown && problem.givenKnown[role]) || problem.actualKnown[role]}`)
                .join("，");
            return `
                <div class="modern-panel-stage group-3">
                    <div class="modern-exercise-header">
                        <span class="modern-exercise-label">第 3 组</span>
                        <h2 class="modern-exercise-title">已知 ${escapeHtml(knownText)}，求 <span class="modern-exercise-target">${problem.target.toUpperCase()} ${problem.referenceAngle}</span></h2>
                    </div>
                    <div class="modern-angle-chip">参考角 ${problem.referenceAngle}</div>
                    ${stepKey !== "final" ? `
                        <div class="modern-focus-line">
                            ${stepKey === "ratio"
                                ? "先填写两条已知边对应的最简系数"
                                : "继续填写第三边系数"}
                        </div>
                    ` : `
                        <div class="modern-step-card current panel-final-stage">
                            <strong>最后一步</strong>
                            <p>结合左图，填写分子和分母。</p>
                            <div class="modern-inline-fraction">
                                <span>${problem.target} ${problem.referenceAngle} =</span>
                                <div class="modern-inline-fraction-stack">
                                    <input type="text" id="guided-final-top" value="${escapeAttr(problem.finalInputs.numerator)}" class="${(problem.finalErrors && problem.finalErrors.numerator) ? "is-error" : ""}">
                                    <div class="modern-fraction-bar"></div>
                                    <input type="text" id="guided-final-bottom" value="${escapeAttr(problem.finalInputs.denominator)}" class="${(problem.finalErrors && problem.finalErrors.denominator) ? "is-error" : ""}">
                                </div>
                            </div>
                        </div>
                    `}
                    ${renderModernHintArea(problem)}
                </div>
            `;
        }

        function renderModernGuidedDoneSteps(problem) {
            const labels = {
                mark: "第 1 步：已知长度已标到边上",
                ratio: "第 2 步：最简 z 比已写出",
                third: "第 3 步：第三边已补出",
                final: "第 4 步：最终三角比已求出"
            };
            return ["mark", "ratio", "third", "final"]
                .filter((key) => problem.steps[key].done)
                .map((key) => `
                    <div class="modern-step-card done">
                        <strong>${labels[key]}</strong>
                        <div class="modern-step-done-value">${escapeHtml(problem.steps[key].value)}</div>
                    </div>
                `)
                .join("");
        }

        function renderModernHintArea(problem) {
            if (problem.kind === "meaning") {
                if (problem.hintVisible) {
                    return `<div class="modern-hint-box"><div class="modern-hint-box-header">提示</div><p>先看参考角 ${problem.referenceAngle}：贴着它的直角边是邻边，另一条直角边是对边，斜边始终对着直角。</p></div>`;
                }
                if (problem.hintUsed >= 2) {
                    return '<div class="modern-hint-area"></div>';
                }
                return `<div class="modern-hint-area"><button type="button" class="modern-hint-toggle" id="modern-hint-toggle">查看一步提示</button></div>`;
            }
            if (problem.autoHint) {
                return `<div class="modern-hint-box"><div class="modern-hint-box-header">提示</div><p>${escapeHtml(problem.autoHint)}</p></div>`;
            }
            return `<div class="modern-hint-area"><button type="button" class="modern-hint-toggle" id="modern-local-hint-btn">查看一步提示</button></div>`;
        }

        function renderModernFooter(problem, session) {
            if (problem.kind === "meaning") {
                return `
                    <div class="modern-action-footer">
                        <button type="button" class="modern-reset-btn" id="modern-reset-btn" title="重新选择">重新选择</button>
                        <div class="modern-status-card idle">按顺序选择分子边和分母边</div>
                    </div>
                `;
            }
            if (problem.kind === "ratioToSide") {
                return `
                    <div class="modern-action-footer">
                        <button type="button" class="modern-reset-btn" id="modern-reset-btn" title="清空答案">清空答案</button>
                        <div class="modern-status-card ${problem.inlineStatus.type}">${escapeHtml(problem.inlineStatus.message)}</div>
                    </div>
                `;
            }
            const stepKey = currentGuidedStepKey(problem);
            const statusMessage = stepKey === "ratio"
                ? "填写两条已知边后按 Enter 提交。"
                : stepKey === "third"
                    ? "填写第三边后按 Enter 提交。"
                    : "填写分子和分母后按 Enter 提交。";
            return `
                <div class="modern-action-footer">
                    <button type="button" class="modern-reset-btn" id="modern-reset-btn" title="重置当前步骤">重置当前步骤</button>
                    <div class="modern-status-card ${state.session.phase === "wrong_feedback" ? "error" : "idle"}">${statusMessage}</div>
                </div>
            `;
        }

        function renderModernSuccessToast(problem, session) {
            if (!problem.solved || session.meaningSummaryOpen) {
                return "";
            }
            const copy = problem.kind === "meaning"
                ? `✓ 回答正确，已完成 ${problem.trig.toUpperCase()} ${problem.referenceAngle}。`
                : problem.kind === "ratioToSide"
                    ? "✓ 回答正确，三边长度已补全。"
                    : `✓ 本题完成，${problem.target} ${problem.referenceAngle} = ${problem.final}。`;
            return `<div class="modern-success-toast">${copy}</div>`;
        }

        function buildModernSideValues(problem) {
            if (problem.kind === "meaning") {
                return { AB: "", BC: "", AC: "" };
            }
            if (problem.kind === "ratioToSide") {
                return problem.edgeInputs;
            }
            const sideValues = { AB: "", BC: "", AC: "" };
            if (problem.steps.ratio.done) {
                Object.entries(problem.zRoles).forEach(([role, value]) => {
                    sideValues[getSideForRole(problem.referenceAngle, role)] = `${value}z`;
                });
            }
            if (problem.steps.third.done) {
                sideValues[getSideForRole(problem.referenceAngle, problem.thirdRole)] = `${problem.thirdZ}z`;
            }
            return sideValues;
        }

        function getTrianglePoints(problem) {
            const defaultTriple = { AB: makeLength(3), BC: makeLength(4), AC: makeLength(5) };
            const lengths = problem.kind === "ratioToSide"
                ? (problem.triple || defaultTriple)
                : problem.kind === "guidedSolve"
                    ? (problem.baseTriple || defaultTriple)
                    : defaultTriple;
            const layout = problem.layout || "horizontal";
            const rawAB = Math.max(0.0001, lengthValue(lengths.AB) || 3);
            const rawBC = Math.max(0.0001, lengthValue(lengths.BC) || 4);
            const unit = 40;
            const isABLonger = rawAB >= rawBC;
            const displayAB = isABLonger ? 5 * unit : 4 * unit;
            const displayBC = isABLonger ? 4 * unit : 5 * unit;
            if (layout === "vertical") {
                const baseX = 110;
                const baseY = 300;
                return {
                    A: { x: baseX, y: baseY },
                    B: { x: baseX, y: baseY - displayAB },
                    C: { x: baseX + displayBC, y: baseY - displayAB }
                };
            }
            const baseX = 90;
            const baseY = 292;
            return {
                A: { x: baseX, y: baseY },
                B: { x: baseX + displayAB, y: baseY },
                C: { x: baseX + displayAB, y: baseY - displayBC }
            };
        }

        function renderModernTriangleSvg(problem) {
            const trianglePoints = getTrianglePoints(problem);
            const pointA = trianglePoints.A;
            const pointB = trianglePoints.B;
            const pointC = trianglePoints.C;
            const stageWidth = TRIANGLE_STAGE_WIDTH;
            const stageHeight = TRIANGLE_STAGE_HEIGHT;
            const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
            const mid = (p1, p2) => ({ x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 });
            const normalize = (dx, dy) => {
                const length = Math.hypot(dx, dy) || 1;
                return { x: dx / length, y: dy / length };
            };
            const centroid = {
                x: (pointA.x + pointB.x + pointC.x) / 3,
                y: (pointA.y + pointB.y + pointC.y) / 3
            };
            const isVerticalLayout = (problem.layout || "horizontal") === "vertical";
            const outwardOffset = (p1, p2, distance) => {
                const m = mid(p1, p2);
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const len = Math.hypot(dx, dy) || 1;
                const n1 = { x: -dy / len, y: dx / len };
                const n2 = { x: -n1.x, y: -n1.y };
                const c1 = { x: m.x + n1.x * distance, y: m.y + n1.y * distance };
                const c2 = { x: m.x + n2.x * distance, y: m.y + n2.y * distance };
                const d1 = Math.hypot(c1.x - centroid.x, c1.y - centroid.y);
                const d2 = Math.hypot(c2.x - centroid.x, c2.y - centroid.y);
                return d1 > d2 ? c1 : c2;
            };
            const clampLabelPoint = (point) => ({
                x: clamp(point.x, 28, stageWidth - 28),
                y: clamp(point.y, isVerticalLayout ? 32 : 20, stageHeight - 20)
            });
            const clampInputPoint = (point) => ({
                x: clamp(point.x, 38, stageWidth - 38),
                y: clamp(point.y, isVerticalLayout ? 48 : 34, stageHeight - 34)
            });
            const labelOffset = isVerticalLayout ? 16 : 24;
            const inputOffset = isVerticalLayout ? 24 : 36;
            const abLabel = clampLabelPoint(outwardOffset(pointA, pointB, labelOffset));
            const bcLabel = clampLabelPoint(outwardOffset(pointB, pointC, labelOffset));
            const acLabel = clampLabelPoint(outwardOffset(pointA, pointC, labelOffset));
            const abInput = clampInputPoint(outwardOffset(pointA, pointB, inputOffset));
            const bcInput = clampInputPoint(outwardOffset(pointB, pointC, inputOffset));
            const acInput = clampInputPoint(outwardOffset(pointA, pointC, inputOffset));
            const sideCoords = {
                AB: {
                    x1: pointA.x, y1: pointA.y, x2: pointB.x, y2: pointB.y,
                    labelX: abLabel.x, labelY: abLabel.y,
                    inputX: abInput.x, inputY: abInput.y
                },
                BC: {
                    x1: pointB.x, y1: pointB.y, x2: pointC.x, y2: pointC.y,
                    labelX: bcLabel.x, labelY: bcLabel.y,
                    inputX: bcInput.x, inputY: bcInput.y
                },
                AC: {
                    x1: pointA.x, y1: pointA.y, x2: pointC.x, y2: pointC.y,
                    labelX: acLabel.x, labelY: acLabel.y,
                    inputX: acInput.x, inputY: acInput.y
                }
            };
            const values = buildModernSideValues(problem);
            const currentStep = problem.kind === "guidedSolve" ? currentGuidedStepKey(problem) : "";
            const hitAreaAttrs = (side) => {
                const role = getRoleForSide(problem.referenceAngle || "A", side);
                const coords = sideCoords[side];
                if (problem.kind === "meaning") {
                    return `<line class="modern-side-hit" data-role-pick="${role}" x1="${coords.x1}" y1="${coords.y1}" x2="${coords.x2}" y2="${coords.y2}"></line>`;
                }
                return "";
            };
            const strokeAttrs = (side) => {
                const coords = sideCoords[side];
                const role = getRoleForSide(problem.referenceAngle || "A", side);
                const filled = Boolean(values[side]);
                const shouldCelebrate = problem.solved || problem.kind === "guidedSolve";
                const strokeColor = filled && shouldCelebrate
                    ? role === "opposite" ? "var(--role-opposite)" : role === "adjacent" ? "var(--role-adjacent)" : "var(--role-hypotenuse)"
                    : "#cbd5e1";
                return `<line class="modern-side-stroke ${filled && shouldCelebrate ? "modern-edge-selected" : ""}" x1="${coords.x1}" y1="${coords.y1}" x2="${coords.x2}" y2="${coords.y2}" stroke="${strokeColor}" stroke-width="${filled && shouldCelebrate ? 4 : 2.5}" stroke-linecap="round"></line>`;
            };
            const textLabels = SIDE_SEQUENCE.map((side) => {
                const coords = sideCoords[side];
                const showValue = problem.kind !== "ratioToSide" || problem.solved;
                const value = values[side] && showValue ? ` ${values[side]}` : "";
                return `<text x="${coords.labelX}" y="${coords.labelY}" text-anchor="middle" fill="#475569" font-size="14" font-weight="700">${side}${value}</text>`;
            }).join("");
            const buildAngleArc = (vertex, p1, p2) => {
                const radius = 28;
                const u1 = normalize(p1.x - vertex.x, p1.y - vertex.y);
                const u2 = normalize(p2.x - vertex.x, p2.y - vertex.y);
                const start = { x: vertex.x + u1.x * radius, y: vertex.y + u1.y * radius };
                const end = { x: vertex.x + u2.x * radius, y: vertex.y + u2.y * radius };
                const bisector = normalize(u1.x + u2.x, u1.y + u2.y);
                const control = { x: vertex.x + bisector.x * radius * 0.72, y: vertex.y + bisector.y * radius * 0.72 };
                return `<path d="M ${start.x} ${start.y} Q ${control.x} ${control.y} ${end.x} ${end.y}" fill="none" stroke="var(--primary)" stroke-width="2.5"></path>`;
            };
            const angleArc = problem.referenceAngle === "C"
                ? buildAngleArc(pointC, pointA, pointB)
                : buildAngleArc(pointA, pointB, pointC);
            const buildRightAngleMarker = () => {
                const unitBA = normalize(pointA.x - pointB.x, pointA.y - pointB.y);
                const unitBC = normalize(pointC.x - pointB.x, pointC.y - pointB.y);
                const marker = 20;
                const p1 = { x: pointB.x + unitBA.x * marker, y: pointB.y + unitBA.y * marker };
                const p2 = { x: p1.x + unitBC.x * marker, y: p1.y + unitBC.y * marker };
                const p3 = { x: pointB.x + unitBC.x * marker, y: pointB.y + unitBC.y * marker };
                return `<path d="M ${p1.x} ${p1.y} L ${p2.x} ${p2.y} L ${p3.x} ${p3.y}" fill="none" stroke="#94a3b8" stroke-width="1.5"></path>`;
            };
            const vertexLabelPos = {
                A: isVerticalLayout ? { x: pointA.x - 24, y: pointA.y + 8 } : { x: pointA.x - 24, y: pointA.y + 10 },
                B: isVerticalLayout ? { x: pointB.x - 24, y: pointB.y - 12 } : { x: pointB.x + 12, y: pointB.y + 14 },
                C: isVerticalLayout ? { x: pointC.x + 10, y: pointC.y - 6 } : { x: pointC.x + 12, y: pointC.y - 10 }
            };
            let edgeInputs = "";
            if (problem.kind === "ratioToSide" && !problem.solved) {
                edgeInputs = SIDE_SEQUENCE.map((side) => `
                    <input type="text" inputmode="numeric" class="modern-edge-input ${(problem.edgeErrors && problem.edgeErrors[side]) ? "is-error" : ""}"
                        style="left:${(sideCoords[side].inputX / stageWidth) * 100}%;top:${(sideCoords[side].inputY / stageHeight) * 100}%;"
                        data-edge-input="${side}" value="${escapeAttr(problem.edgeInputs[side] || "")}" placeholder="?">
                `).join("");
            }
            if (problem.kind === "guidedSolve") {
                const roleBySide = Object.fromEntries(SIDE_SEQUENCE.map((side) => [side, getRoleForSide(problem.referenceAngle, side)]));
                if (currentStep === "ratio") {
                    edgeInputs = SIDE_SEQUENCE
                        .filter((side) => problem.knownRoles.includes(roleBySide[side]))
                        .map((side) => {
                            const role = roleBySide[side];
                            return `
                                <input type="text" inputmode="numeric" class="modern-edge-input ${(problem.ratioErrors && problem.ratioErrors[role]) ? "is-error" : ""}"
                                    style="left:${(sideCoords[side].inputX / stageWidth) * 100}%;top:${(sideCoords[side].inputY / stageHeight) * 100}%;"
                                    data-guided-ratio-role="${role}" value="${escapeAttr(problem.ratioInputs[role] || "")}" placeholder="?">
                            `;
                        })
                        .join("");
                } else if (currentStep === "third") {
                    const thirdSide = getSideForRole(problem.referenceAngle, problem.thirdRole);
                    edgeInputs = `
                        <input type="text" inputmode="numeric" id="guided-third-input"
                            class="modern-edge-input ${problem.thirdError ? "is-error" : ""}"
                            style="left:${(sideCoords[thirdSide].inputX / stageWidth) * 100}%;top:${(sideCoords[thirdSide].inputY / stageHeight) * 100}%;"
                            value="${escapeAttr(problem.thirdInput || "")}" placeholder="?">
                    `;
                }
            }
            return `
                <div class="modern-triangle-stage ${problem.kind === "ratioToSide" ? "ratio-input-mode" : ""} ${problem.kind === "guidedSolve" ? `guided-stage guided-${currentStep}` : ""}">
                    <svg viewBox="0 0 ${stageWidth} ${stageHeight}" width="100%">
                        <defs>
                            <pattern id="modern-grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"></path>
                            </pattern>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#modern-grid)"></rect>
                        ${buildRightAngleMarker()}
                        ${SIDE_SEQUENCE.map((side) => `${hitAreaAttrs(side)}${strokeAttrs(side)}`).join("")}
                        ${angleArc}
                        <text x="${vertexLabelPos.A.x}" y="${vertexLabelPos.A.y}" font-weight="700" fill="#475569" font-size="18">A</text>
                        <text x="${vertexLabelPos.B.x}" y="${vertexLabelPos.B.y}" font-weight="700" fill="#475569" font-size="18">B</text>
                        <text x="${vertexLabelPos.C.x}" y="${vertexLabelPos.C.y}" font-weight="700" fill="#475569" font-size="18">C</text>
                        ${textLabels}
                    </svg>
                    ${edgeInputs}
                </div>
            `;
        }

        function bindModernEvents(problem) {
            const backBtn = document.getElementById("modern-back-btn");
            if (backBtn) backBtn.addEventListener("click", () => backHome());
            const restartBtn = document.getElementById("modern-restart-btn");
            if (restartBtn) restartBtn.addEventListener("click", () => resetCurrentGroup());
            const retryBtn = document.getElementById("meaning-summary-retry-btn");
            if (retryBtn) retryBtn.addEventListener("click", () => startGroup("meaning"));
            const nextSummaryBtn = document.getElementById("meaning-summary-next-btn");
            if (nextSummaryBtn) nextSummaryBtn.addEventListener("click", () => startGroup(nextGroupId("meaning") || "ratioToSide"));
            const localHintBtn = document.getElementById("modern-local-hint-btn");
            if (localHintBtn) localHintBtn.addEventListener("click", () => revealLocalHint());
            document.querySelectorAll('input[name="guided-difficulty"]').forEach((radio) => {
                radio.addEventListener("change", () => {
                    if (!radio.checked) return;
                    setGuidedDifficulty(radio.value);
                    rerenderModernOnly();
                });
            });
            if (problem.kind === "meaning") {
                document.querySelectorAll("[data-role-pick]").forEach((node) => node.addEventListener("click", () => pickMeaningRole(node.dataset.rolePick)));
                const hintToggle = document.getElementById("modern-hint-toggle");
                if (hintToggle) hintToggle.addEventListener("click", () => showMeaningHint());
                const resetBtn = document.getElementById("modern-reset-btn");
                if (resetBtn) resetBtn.addEventListener("click", () => resetMeaningSelection());
                focusModernPrimaryInput(problem);
                return;
            }
            if (problem.kind === "ratioToSide") {
                const edgeInputs = Array.from(document.querySelectorAll("[data-edge-input]"));
                edgeInputs.forEach((input) => {
                    input.addEventListener("input", () => {
                        if (!problem.edgeErrors) problem.edgeErrors = { AB: false, BC: false, AC: false };
                        problem.edgeInputs[input.dataset.edgeInput] = input.value.trim();
                        problem.edgeErrors[input.dataset.edgeInput] = false;
                        resetRatioInputStatus(problem);
                    });
                    input.addEventListener("keydown", (event) => {
                        if (event.key === "Enter") {
                            event.preventDefault();
                            input.blur();
                            checkDirectSideInputs();
                        }
                    });
                });
                bindInputTabCycle(edgeInputs);
                const resetBtn = document.getElementById("modern-reset-btn");
                if (resetBtn) resetBtn.addEventListener("click", () => clearPlacement());
                focusModernPrimaryInput(problem);
                return;
            } else {
                const guidedRatioInputs = Array.from(document.querySelectorAll("[data-guided-ratio-role]"));
                guidedRatioInputs.forEach((input) => {
                    input.addEventListener("input", () => {
                        if (!problem.ratioErrors) {
                            problem.ratioErrors = Object.fromEntries(problem.knownRoles.map((role) => [role, false]));
                        }
                        problem.ratioInputs[input.dataset.guidedRatioRole] = input.value.trim();
                        problem.ratioErrors[input.dataset.guidedRatioRole] = false;
                    });
                    input.addEventListener("keydown", (event) => {
                        if (event.key === "Enter") {
                            event.preventDefault();
                            submitGuidedRatioStep();
                        }
                    });
                });
                bindInputTabCycle(guidedRatioInputs);
                const thirdInput = document.getElementById("guided-third-input");
                if (thirdInput) {
                    thirdInput.addEventListener("input", () => {
                        problem.thirdInput = thirdInput.value.trim();
                        problem.thirdError = false;
                    });
                    thirdInput.addEventListener("keydown", (event) => {
                        if (event.key === "Enter") {
                            event.preventDefault();
                            submitGuidedThirdStep();
                        }
                    });
                    bindInputTabCycle([thirdInput]);
                }
                const finalTop = document.getElementById("guided-final-top");
                const finalBottom = document.getElementById("guided-final-bottom");
                if (finalTop) finalTop.addEventListener("input", () => {
                    if (!problem.finalErrors) problem.finalErrors = { numerator: false, denominator: false };
                    problem.finalInputs.numerator = finalTop.value.trim();
                    problem.finalErrors.numerator = false;
                });
                if (finalBottom) finalBottom.addEventListener("input", () => {
                    if (!problem.finalErrors) problem.finalErrors = { numerator: false, denominator: false };
                    problem.finalInputs.denominator = finalBottom.value.trim();
                    problem.finalErrors.denominator = false;
                });
                if (finalTop) finalTop.addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        submitGuidedFinalStep();
                    }
                });
                if (finalBottom) finalBottom.addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        submitGuidedFinalStep();
                    }
                });
                const finalInputs = [finalTop, finalBottom].filter(Boolean);
                bindInputTabCycle(finalInputs);
                const resetBtn = document.getElementById("modern-reset-btn");
                if (resetBtn) resetBtn.addEventListener("click", () => resetGuidedCurrentStep());
                focusModernPrimaryInput(problem);
            }
        }

        function focusModernPrimaryInput(problem) {
            let target = null;
            if (problem.kind === "ratioToSide") {
                const firstEmpty = SIDE_SEQUENCE.find((side) => !problem.edgeInputs[side]);
                const side = firstEmpty || SIDE_SEQUENCE[0];
                target = document.querySelector(`[data-edge-input="${side}"]`);
            } else if (problem.kind === "guidedSolve") {
                const stepKey = currentGuidedStepKey(problem);
                if (stepKey === "ratio") {
                    const firstRole = problem.knownRoles.find((role) => !problem.ratioInputs[role]) || problem.knownRoles[0];
                    target = document.querySelector(`[data-guided-ratio-role="${firstRole}"]`);
                } else if (stepKey === "third") {
                    target = document.getElementById("guided-third-input");
                } else if (stepKey === "final") {
                    target = document.getElementById("guided-final-top");
                }
            }
            if (target) {
                requestAnimationFrame(() => target.focus());
            }
        }

        function bindInputTabCycle(inputs) {
            if (!inputs || !inputs.length) {
                return;
            }
            inputs.forEach((input) => {
                input.addEventListener("keydown", (event) => {
                    if (event.key !== "Tab") {
                        return;
                    }
                    event.preventDefault();
                    const enabled = inputs.filter((node) => !node.disabled);
                    if (!enabled.length) {
                        return;
                    }
                    const currentIndex = enabled.indexOf(input);
                    if (currentIndex < 0) {
                        enabled[0].focus();
                        return;
                    }
                    const delta = event.shiftKey ? -1 : 1;
                    const nextIndex = (currentIndex + delta + enabled.length) % enabled.length;
                    enabled[nextIndex].focus();
                    enabled[nextIndex].select?.();
                });
            });
        }

        function verifyModernAnswer() {
            const problem = currentProblem();
            if (problem.solved) {
                executeAdvance();
                return;
            }
            if (!problem.selectedRoles[0] || !problem.selectedRoles[1]) {
                return;
            }
            const expectedRoles = problem.roles;
            const isCorrect = problem.selectedRoles[0] === expectedRoles[0] && problem.selectedRoles[1] === expectedRoles[1];
            if (isCorrect) {
                recordProblemCompletion(problem);
                problem.solved = true;
                setSessionPhase("correct_pause");
                rerenderModernOnly();
                advanceAfterSolve();
                return;
            }
            problem.wrongAttempts += 1;
            setSessionPhase("wrong_feedback");
            rerenderModernOnly();
            if (problem.wrongAttempts >= 2) {
                showMeaningHint();
            }
        }

        function rerenderModernOnly() {
            const session = state.session;
            const problem = currentProblem();
            if (!session) return;
            renderPlayModern(problem, session);
        }

        function buildActionBanner(problem) {
            if (problem.kind === "meaning") {
                return problem.selectedRoles.length === 0
                    ? "当前任务：先选择分子边"
                    : "当前任务：再选择分母边";
            }
            if (problem.kind === "ratioToSide") {
                return "当前任务：根据比值补全三边长度";
            }
            const currentStep = ["mark", "ratio", "third", "final"].find((name) => !problem.steps[name].done) || "final";
            const labels = {
                mark: "当前任务：先标出已知边",
                ratio: "当前任务：先写出最简 z 比",
                third: "当前任务：继续补出第三边",
                final: "当前任务：填写目标三角比"
            };
            return labels[currentStep];
        }

        function renderCoach(problem) {
            const localHint = problem.autoHint || "先自行完成当前步骤；如果卡住，再查看提示。";
            const openAttr = problem.autoHint ? "open" : "";
            return `
                <details class="coach-panel" ${openAttr}>
                    <summary class="coach-launch">
                        <div>
                            <strong>提示</strong>
                            <div class="small">只提示下一步，不直接给出答案。</div>
                        </div>
                        <span class="small">展开 / 收起</span>
                    </summary>
                    <div class="coach-body stack" style="gap:12px;">
                        <div class="note-box">提示：${localHint}</div>
                        <div class="feedback-actions">
                            <button type="button" class="ghost-btn" id="local-hint-btn">再看一条提示</button>
                        </div>
                    </div>
                </details>
            `;
        }

        function computeCurrentTargetRoles(problem) {
            return [];
        }

        function buildTriangleLabels(problem) {
            if (problem.kind === "ratioToSide") {
                return {
                    opposite: problem.edgeInputs[getSideForRole(problem.referenceAngle, "opposite")] || "",
                    adjacent: problem.edgeInputs[getSideForRole(problem.referenceAngle, "adjacent")] || "",
                    hypotenuse: problem.edgeInputs.AC || ""
                };
            }
            if (problem.kind === "guidedSolve") {
                return {
                    opposite: problem.actualKnown.opposite || "",
                    adjacent: problem.actualKnown.adjacent || "",
                    hypotenuse: problem.actualKnown.hypotenuse || ""
                };
            }
            return { opposite: "", adjacent: "", hypotenuse: "" };
        }

        function renderDiagram(problem, group) {
            const labels = buildTriangleLabels(problem);
            const targetRoles = computeCurrentTargetRoles(problem);
            return problem.kind === "meaning"
                ? renderTriangleSvg(problem, group.color, labels, targetRoles, true)
                : `${renderTriangleSvg(problem, group.color, labels, targetRoles, false)}<div class="small">固定约定：以 A 为参考角，AB 是邻边，BC 是对边，AC 是斜边。</div>`;
        }

        function renderTriangleSvg(problem, color, sideValues = null, targetRoles = [], minimalMeaningMode = false) {
            const labels = sideValues || {};
            const filledRoles = Object.keys(labels).filter((role) => labels[role]);
            const solvedRoles = problem.solved ? filledRoles.concat(targetRoles) : [];
            const roleColor = (role) => {
                if (targetRoles.includes(role) || filledRoles.includes(role)) {
                    if (role === "opposite") return "var(--role-opposite)";
                    if (role === "adjacent") return "var(--role-adjacent)";
                    if (role === "hypotenuse") return "var(--role-hypotenuse)";
                }
                return "#a8a090";
            };
            const edgeStroke = (role, x1, y1, x2, y2) => {
                const edgeCorrectClass = solvedRoles.includes(role) && state.session && state.session.phase === "correct_pause" ? "edge-correct" : "";
                const targetClass = targetRoles.includes(role) ? "edge-target" : "";
                let interactive = "";
                if (minimalMeaningMode) {
                    interactive = role === "hypotenuse"
                        ? `<polygon class="edge-hit-area-diagonal" data-role-pick="${role}" points="40,218 58,240 296,86 278,52"></polygon>`
                        : `<line class="edge-hit-area" data-role-pick="${role}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
                }
                return `${interactive}<line class="edge-stroke ${minimalMeaningMode ? "edge-hoverable" : ""} ${edgeCorrectClass} ${targetClass}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${roleColor(role)}" stroke-width="7" stroke-linecap="round"></line>`;
            };
            const edgeLabel = (role, x, y, width, value = "") => {
                const stroke = targetRoles.includes(role)
                    ? "rgba(184, 92, 56, 0.34)"
                    : "rgba(90, 82, 72, 0.18)";
                const cardClass = solvedRoles.includes(role) && state.session && state.session.phase === "correct_pause" ? "edge-correct" : "";
                const targetClass = targetRoles.includes(role) ? "edge-target" : "";
                const safeValue = value ? `长度：${escapeHtml(String(value))}` : targetRoles.includes(role) ? "当前目标" : "等待标注";
                return `
                    <g transform="translate(${x} ${y})">
                        <rect class="edge-label-card ${cardClass} ${targetClass}" width="${width}" height="50" rx="12" ry="12" style="stroke:${stroke};"></rect>
                        <rect x="12" y="10" width="42" height="13" rx="6.5" ry="6.5" fill="${roleColor(role)}" opacity="0.2"></rect>
                        <text class="edge-label-side" x="17" y="20">${SIDE_LABELS[role]}</text>
                        <text class="edge-label-role" x="64" y="21">${ROLE_LABELS[role]}</text>
                        <text class="edge-label-note" x="17" y="36">${ROLE_NOTES[role]}</text>
                        <text class="edge-label-value" x="${width - 16}" y="36" text-anchor="end">${safeValue}</text>
                    </g>
                `;
            };
            const badge = problem.kind === "guidedSolve"
                ? `<div class="selection-banner">目标：已知 ${problem.knownType} A，最后求 ${problem.target} A</div>`
                : problem.kind === "ratioToSide"
                    ? `<div class="selection-banner">题目：${problem.ratioText}</div>`
                    : `<div class="selection-banner">题目：${problem.targetText}</div>`;
            return `
                ${minimalMeaningMode ? "" : badge}
                <svg viewBox="0 0 360 300" width="100%" height="250" aria-label="直角三角形教具">
                    <defs>
                        <linearGradient id="triangle-board-fill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="rgba(255,252,247,0.98)"></stop>
                            <stop offset="100%" stop-color="rgba(247,238,224,0.96)"></stop>
                        </linearGradient>
                    </defs>
                    <polygon points="52,224 284,224 284,64" fill="url(#triangle-board-fill)" opacity="0.72"></polygon>
                    ${edgeStroke("adjacent", 52, 224, 284, 224)}
                    ${edgeStroke("opposite", 284, 224, 284, 64)}
                    ${edgeStroke("hypotenuse", 52, 224, 284, 64)}
                    <path d="M252 224 L252 192 L284 192" stroke="#72808a" stroke-width="4" fill="none"></path>
                    <path d="M96 224 A42 42 0 0 1 86 191" stroke="var(--primary)" stroke-width="4" fill="none"></path>
                    <text x="80" y="190" font-size="18" fill="var(--primary)">A</text>
                    <circle class="vertex-dot" cx="52" cy="224" r="11"></circle>
                    <circle class="vertex-dot" cx="284" cy="224" r="11"></circle>
                    <circle class="vertex-dot" cx="284" cy="64" r="11"></circle>
                    <text class="vertex-label" x="47" y="230">A</text>
                    <text class="vertex-label" x="279" y="230">B</text>
                    <text class="vertex-label" x="279" y="70">C</text>
                    ${minimalMeaningMode ? "" : edgeLabel("adjacent", 104, 238, 132, labels.adjacent)}
                    ${minimalMeaningMode ? "" : edgeLabel("opposite", 210, 118, 132, labels.opposite)}
                    ${minimalMeaningMode ? "" : edgeLabel("hypotenuse", 92, 74, 146, labels.hypotenuse)}
                </svg>
            `;
        }

        function renderQuestion(problem) {
            if (problem.kind === "meaning") {
                return renderMeaningQuestion(problem);
            }
            if (problem.kind === "ratioToSide") {
                return renderRatioToSideQuestion(problem);
            }
            return renderGuidedSolveQuestion(problem);
        }

        function renderMeaningQuestion(problem) {
            const activeIndex = Math.min(problem.selectedRoles.length, 1);
            const trigUpper = problem.trig.toUpperCase();
            const numeratorValue = problem.selectedRoles[0] ? SIDE_LABELS[problem.selectedRoles[0]] : "?";
            const denominatorValue = problem.selectedRoles[1] ? SIDE_LABELS[problem.selectedRoles[1]] : "?";
            const hintPrompt = activeIndex === 0
                ? `点击 ${trigUpper} A 的分子边（${ROLE_LABELS[problem.roles[0]]}）`
                : `点击 ${trigUpper} A 的分母边（${ROLE_LABELS[problem.roles[1]]}）`;
            const showHintBtn = problem.hintUsed >= 3 ? "" : `<button type="button" class="tiny-btn" id="show-meaning-hint-btn">查看提示</button>`;
            const hintTextBlock = problem.hintVisible
                ? `<div class="meaning-hint">${hintPrompt}</div>`
                : "";
            return `
                <div class="meaning-shell">
                    <div class="meaning-heading">
                        <h3>求 ${trigUpper} A</h3>
                        ${hintTextBlock}
                    </div>
                    <div class="formula-fraction-card">
                        <div class="formula-fraction-layout">
                            <div class="formula-equals">${trigUpper} A =</div>
                            <div class="fraction-stack">
                                <div class="meaning-slot numerator-slot ${activeIndex === 0 ? "active" : ""} ${problem.selectedRoles[0] ? "filled" : ""}">
                                    <div class="meaning-slot-value">${numeratorValue}</div>
                                </div>
                                <div class="fraction-bar"></div>
                                <div class="meaning-slot denominator-slot ${activeIndex === 1 ? "active" : ""} ${problem.selectedRoles[1] ? "filled" : ""}">
                                    <div class="meaning-slot-value">${denominatorValue}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="btn-row">
                        ${showHintBtn}
                        <button type="button" class="ghost-btn" id="reset-meaning-btn">重置</button>
                    </div>
                </div>
            `;
        }

        function renderRatioToSideQuestion(problem) {
            const targetRoles = computeCurrentTargetRoles(problem);
            return `
                <div class="pill">第 2 组</div>
                <div class="formula-card">
                    <div class="formula-main">${problem.ratioText}</div>
                    <div class="formula-sub">选中数字卡后，只把它落到高亮目标边。</div>
                </div>
                <div class="selection-banner">已选数字：${problem.selectedToken || "未选择"}。放对两次后会自动进入下一题。</div>
                <div class="token-row">
                    ${[String(problem.numerator), String(problem.denominator)].map((token) => `
                        <div class="token-chip ${problem.selectedToken === token ? "active" : ""}" draggable="true" data-token="${token}">
                            <strong>${token}</strong>
                            <small>${token === String(problem.numerator) ? "分子卡" : "分母卡"}</small>
                        </div>
                    `).join("")}
                    <button type="button" class="tiny-btn" id="clear-placement-btn">清空放置</button>
                </div>
                <div class="drop-grid">
                    ${["opposite", "adjacent", "hypotenuse"].map((role) => `
                        <button type="button" class="drop-target ${targetRoles.includes(role) ? "available" : ""} ${problem.targets[role] ? "correct" : ""}" data-place-role="${role}">
                            <strong>${SIDE_LABELS[role]} · ${ROLE_LABELS[role]}</strong>
                            <small>${problem.targets[role] ? `当前已放：${problem.targets[role]}` : targetRoles.includes(role) ? "当前可放" : "暂未选中到这条边"}</small>
                            <em>${problem.correctPlacement[role] ? "这条边需要一个数字" : "这条边本题不需要数字"}</em>
                        </button>
                    `).join("")}
                </div>
            `;
        }

        function renderGuidedSolveQuestion(problem) {
            const knownEntries = Object.entries(problem.actualKnown).map(([role, value]) => `${ROLE_LABELS[role]}=${value}`).join("，");
            return `
                <div class="pill">第 3 组</div>
                <div class="formula-card">
                    <div class="formula-main">已知 ${problem.knownType} A，求 ${problem.target} A</div>
                    <div class="formula-sub">一步做对，下一步才会展开。</div>
                </div>
                <div class="note-box">已知：${knownEntries}。</div>
                <div class="stepper-list">
                    ${renderStepCard(problem, "mark", "第 1 步：标已知边", "先把已知长度标到边上", "用“对边=..., 斜边=...”这样的格式填写。")}
                    ${renderStepCard(problem, "ratio", "第 2 步：写最简 z 比", "再化成最简 z 比", "例如：对边=3z, 邻边=4z。")}
                    ${renderStepCard(problem, "third", "第 3 步：补第三边", "再补第三边", "只填第三边，例如：斜边=5z。")}
                    ${renderStepCard(problem, "final", `第 4 步：求 ${problem.target} A`, "最后代回目标三角比", "写最终最简比值，例如 3/5。")}
                </div>
            `;
        }

        function renderStepCard(problem, key, title, voice, helper) {
            const order = ["mark", "ratio", "third", "final"];
            const currentStep = order.find((name) => !problem.steps[name].done) || "final";
            const step = problem.steps[key];
            if (step.done) {
                return `
                    <div class="step-card done">
                        <div class="step-title">
                            <strong>${title}</strong>
                            <span class="small">已完成</span>
                        </div>
                        <div class="step-summary">${escapeHtml(step.value)}</div>
                    </div>
                `;
            }
            if (currentStep !== key) {
                return `
                    <div class="step-card locked folded">
                        <div class="step-title">
                            <strong>${title}</strong>
                            <span class="small">等待上一步</span>
                        </div>
                        <div class="muted">${helper}</div>
                    </div>
                `;
            }
            return `
                <div class="step-card current" data-step-card="${key}">
                    <div class="step-title">
                        <strong>${title}</strong>
                        <span class="small">当前步骤</span>
                    </div>
                    <div class="step-voice">步骤提示：${voice}</div>
                    <div class="muted">${helper}</div>
                    <input type="text" data-step-input="${key}" value="${escapeAttr(step.value)}">
                    <div class="step-actions">
                        <button type="button" class="tiny-btn" data-step-submit="${key}">提交这一步</button>
                    </div>
                </div>
            `;
        }

        function bindQuestionEvents(problem) {
            bindCoachEvents();

            if (problem.kind === "meaning") {
                document.querySelectorAll("[data-role-pick]").forEach((button) => {
                    button.addEventListener("click", () => pickMeaningRole(button.dataset.rolePick));
                });
                const resetMeaningBtn = document.getElementById("reset-meaning-btn");
                if (resetMeaningBtn) {
                    resetMeaningBtn.addEventListener("click", resetMeaningSelection);
                }
                const showHintBtn = document.getElementById("show-meaning-hint-btn");
                if (showHintBtn) {
                    showHintBtn.addEventListener("click", showMeaningHint);
                }
                return;
            }

            if (problem.kind === "ratioToSide") {
                document.querySelectorAll("[data-token]").forEach((tokenNode) => {
                    tokenNode.addEventListener("click", () => selectToken(tokenNode.dataset.token));
                    tokenNode.addEventListener("dragstart", (event) => {
                        selectToken(tokenNode.dataset.token);
                        event.dataTransfer.setData("text/plain", tokenNode.dataset.token);
                    });
                });
                document.querySelectorAll("[data-place-role]").forEach((targetNode) => {
                    targetNode.addEventListener("click", () => placeToken(targetNode.dataset.placeRole));
                    targetNode.addEventListener("dragover", (event) => event.preventDefault());
                    targetNode.addEventListener("drop", (event) => {
                        event.preventDefault();
                        const token = event.dataTransfer.getData("text/plain");
                        if (token) {
                            selectToken(token);
                            placeToken(targetNode.dataset.placeRole);
                        }
                    });
                });
                document.getElementById("clear-placement-btn").addEventListener("click", clearPlacement);
                return;
            }

            document.querySelectorAll("[data-step-submit]").forEach((button) => {
                button.addEventListener("click", () => submitStep(button.dataset.stepSubmit));
            });
            document.querySelectorAll("[data-step-input]").forEach((input) => {
                input.addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        submitStep(input.dataset.stepInput);
                    }
                });
            });
        }

        function bindCoachEvents() {
            const localHintBtn = document.getElementById("modern-local-hint-btn");
            if (localHintBtn) {
                localHintBtn.addEventListener("click", () => revealLocalHint());
            }
        }

        function noteInteraction() {
            unlockFeedbackAudio();
            if (!state.session || state.session.firstInteractionDone) {
                return;
            }
            state.session.firstInteractionDone = true;
            state.session.startMs = Date.now();
            ensureProblemStart(currentProblem(), state.session.startMs);
            state.timerHandle = setInterval(() => {
                if (!state.session || !state.session.startMs) {
                    return;
                }
                state.session.elapsedMs = Date.now() - state.session.startMs;
                const liveTimer = document.getElementById("live-timer");
                if (liveTimer) {
                    liveTimer.textContent = formatSeconds(state.session.elapsedMs);
                }
                const modernLiveTimer = document.getElementById("modern-live-timer");
                if (modernLiveTimer) {
                    modernLiveTimer.textContent = formatSeconds(state.session.elapsedMs);
                }
            }, 100);
        }

        function stopTimer() {
            if (state.timerHandle) {
                clearInterval(state.timerHandle);
                state.timerHandle = null;
            }
        }

        function startIdleWatch() {
            clearIdleWatch();
            state.idleHandle = setTimeout(() => {
                revealLocalHint(true);
            }, 12000);
        }

        function clearIdleWatch() {
            if (state.idleHandle) {
                clearTimeout(state.idleHandle);
                state.idleHandle = null;
            }
        }

        function refreshAfterInteraction() {
            clearIdleWatch();
            startIdleWatch();
        }

        function setFeedback(type, title, body) {
            const box = document.getElementById("feedback-box");
            if (!box) return;
            box.className = `feedback-box ${type}`.trim();
            box.innerHTML = `<strong>${title}</strong><div>${body}</div>`;
        }

        function canAnswerCurrentProblem() {
            return state.session && (state.session.phase === "answering" || state.session.phase === "wrong_feedback");
        }

        function revealLocalHint(auto = false) {
            const problem = currentProblem();
            problem.autoHint = problem.localHints[Math.min(problem.wrongAttempts + (auto ? 1 : 0), problem.localHints.length - 1)] || problem.localHints[problem.localHints.length - 1];
            setSessionPhase("wrong_feedback");
            rerenderModernOnly();
        }

        function pickMeaningRole(role) {
            noteInteraction();
            refreshAfterInteraction();
            const problem = currentProblem();
            if (problem.solved || !canAnswerCurrentProblem()) {
                return;
            }
            const expectedRole = problem.roles[problem.selectedRoles.length];
            if (role !== expectedRole) {
                problem.wrongAttempts += 1;
                setSessionPhase("wrong_feedback");
                rerenderModernOnly();
                triggerFeedbackEffect("wrong");
                setFeedback("bad", "先看参考角", "先判断对边、邻边和斜边，再决定分子和分母。");
                if (problem.wrongAttempts >= 2) {
                    revealLocalHint();
                }
                return;
            }
            if (!problem.selectedRoles.includes(role)) {
                problem.selectedRoles.push(role);
            }
            if (problem.selectedRoles.length < 2) {
                setSessionPhase("answering");
                rerenderModernOnly();
                setFeedback("", "已选中分子边", "继续选择分母对应的边。");
                return;
            }
            problem.solved = true;
            recordProblemCompletion(problem);
            setSessionPhase("correct_pause");
            rerenderModernOnly();
            triggerFeedbackEffect("correct");
            setFeedback("good", "回答正确", `${trigWithAngle(problem.trig, problem.referenceAngle)} 已完成，稍后自动进入下一题。`);
            advanceAfterSolve();
        }

        function resetMeaningSelection() {
            const problem = currentProblem();
            if (!problem || problem.kind !== "meaning" || problem.solved) {
                return;
            }
            problem.selectedRoles = [];
            setSessionPhase("answering");
            rerenderModernOnly();
            setFeedback("", "已清空选择", "请从分子边开始重新选择。");
        }

        function resetRatioInputStatus(problem = currentProblem()) {
            if (!problem || problem.kind !== "ratioToSide" || problem.solved) {
                return;
            }
            problem.inlineStatus = {
                type: "idle",
                message: "填写完成后按 Enter 提交"
            };
        }

        function checkDirectSideInputs() {
            noteInteraction();
            refreshAfterInteraction();
            const problem = currentProblem();
            if (problem.solved || !canAnswerCurrentProblem()) {
                return;
            }
            const allFilled = SIDE_SEQUENCE.every((side) => problem.edgeInputs[side] && problem.edgeInputs[side].trim() !== "");
            if (!allFilled) {
                problem.inlineStatus = {
                    type: "warning",
                    message: "请先补全三边长度"
                };
                rerenderModernOnly();
                return;
            }
            const isCorrect = SIDE_SEQUENCE.every((side) => {
                    const input = parseLengthInput(problem.edgeInputs[side]);
                    const expected = problem.triple[side];
                    return input && lengthsEqual(input, expected);
                });
            if (!isCorrect) {
                problem.wrongAttempts += 1;
                setSessionPhase("wrong_feedback");
                if (!problem.edgeErrors) problem.edgeErrors = { AB: false, BC: false, AC: false };
                const wrongSides = SIDE_SEQUENCE.filter((side) => {
                    const input = parseLengthInput(problem.edgeInputs[side]);
                    const expected = problem.triple[side];
                    return !input || !lengthsEqual(input, expected);
                });
                wrongSides.forEach((side) => {
                    problem.edgeErrors[side] = true;
                    problem.edgeInputs[side] = "";
                });
                problem.inlineStatus = {
                    type: "error",
                    message: "有误，请重新填写"
                };
                if (problem.wrongAttempts >= 2) {
                    revealLocalHint();
                }
                rerenderModernOnly();
                triggerFeedbackEffect("wrong");
                if (wrongSides[0]) {
                    requestAnimationFrame(() => {
                        const input = document.querySelector(`[data-edge-input="${wrongSides[0]}"]`);
                        if (input) input.focus();
                    });
                }
                return;
            }
            recordProblemCompletion(problem);
            problem.solved = true;
            setSessionPhase("correct_pause");
            problem.inlineStatus = {
                type: "success",
                message: "回答正确，准备进入下一题"
            };
            rerenderModernOnly();
            triggerFeedbackEffect("correct");
            advanceAfterSolve();
        }

        function clearPlacement() {
            const problem = currentProblem();
            if (!problem || problem.kind !== "ratioToSide") {
                return;
            }
            problem.edgeInputs = { AB: "", BC: "", AC: "" };
            problem.edgeErrors = { AB: false, BC: false, AC: false };
            resetRatioInputStatus(problem);
            setSessionPhase("answering");
            rerenderModernOnly();
        }

        function selectGuidedKnownToken(token) {
            noteInteraction();
            refreshAfterInteraction();
            if (!canAnswerCurrentProblem()) {
                return;
            }
            currentProblem().selectedKnownToken = token;
            rerenderModernOnly();
        }

        function placeGuidedKnownToken(role) {
            noteInteraction();
            refreshAfterInteraction();
            const problem = currentProblem();
            if (problem.solved || !canAnswerCurrentProblem()) {
                return;
            }
            if (!problem.selectedKnownToken) {
                return;
            }
            const expectedRole = Object.entries(problem.actualKnown).find(([, value]) => String(value) === problem.selectedKnownToken);
            if (!expectedRole || expectedRole[0] !== role) {
                problem.wrongAttempts += 1;
                setSessionPhase("wrong_feedback");
                setFeedback("bad", "再核对参考角", "先判断已知长度分别对应哪条边，再完成标注。");
                if (problem.wrongAttempts >= 2) {
                    revealLocalHint();
                }
                problem.selectedKnownToken = null;
                rerenderModernOnly();
                triggerFeedbackEffect("wrong");
                return;
            }
            problem.markTargets[role] = problem.selectedKnownToken;
            problem.selectedKnownToken = null;
            const allMarked = Object.entries(problem.actualKnown).every(([role]) => problem.markTargets[role]);
            if (allMarked) {
                const markValue = Object.entries(problem.actualKnown).map(([role, value]) => `${ROLE_LABELS[role]}=${value}`).sort().join(",");
                problem.steps.mark.value = markValue;
                problem.steps.mark.done = true;
                setSessionPhase("answering");
            }
            rerenderModernOnly();
            if (allMarked) {
                triggerFeedbackEffect("correct");
            }
        }

        function submitGuidedRatioStep() {
            noteInteraction();
            refreshAfterInteraction();
            const problem = currentProblem();
            if (problem.solved || !canAnswerCurrentProblem()) {
                return;
            }
            const roles = Object.keys(problem.zRoles);
            const allFilled = roles.every((role) => problem.ratioInputs[role] && problem.ratioInputs[role].trim() !== "");
            if (!allFilled) {
                return;
            }
            const isCorrect = roles.every((role) => {
                const input = parseLengthInput(problem.ratioInputs[role].trim());
                const expected = parseLengthInput(problem.zRoles[role]);
                return input && expected && lengthsEqual(input, expected);
            });
            if (isCorrect) {
                if (!problem.ratioErrors) {
                    problem.ratioErrors = Object.fromEntries(roles.map((role) => [role, false]));
                }
                const ratioValue = roles.map((role) => `${ROLE_LABELS[role]}=${problem.zRoles[role]}z`).sort().join(",");
                problem.steps.ratio.value = ratioValue;
                problem.steps.ratio.done = true;
                roles.forEach((role) => {
                    problem.ratioErrors[role] = false;
                });
                setSessionPhase("answering");
                rerenderModernOnly();
                triggerFeedbackEffect("correct");
            } else {
                problem.wrongAttempts += 1;
                setSessionPhase("wrong_feedback");
                if (!problem.ratioErrors) {
                    problem.ratioErrors = Object.fromEntries(roles.map((role) => [role, false]));
                }
                const wrongRoles = roles.filter((role) => {
                    const input = parseLengthInput(problem.ratioInputs[role].trim());
                    const expected = parseLengthInput(problem.zRoles[role]);
                    return !input || !expected || !lengthsEqual(input, expected);
                });
                wrongRoles.forEach((role) => {
                    problem.ratioErrors[role] = true;
                    problem.ratioInputs[role] = "";
                });
                if (problem.wrongAttempts >= 2) {
                    revealLocalHint();
                }
                rerenderModernOnly();
                triggerFeedbackEffect("wrong");
                if (wrongRoles[0]) {
                    requestAnimationFrame(() => {
                        const input = document.querySelector(`[data-guided-ratio-role="${wrongRoles[0]}"]`);
                        if (input) input.focus();
                    });
                }
            }
        }

        function submitGuidedThirdStep() {
            noteInteraction();
            refreshAfterInteraction();
            const problem = currentProblem();
            if (problem.solved || !canAnswerCurrentProblem()) {
                return;
            }
            const value = problem.thirdInput.trim();
            if (!value) {
                return;
            }
            const inputParsed = parseLengthInput(value);
            const expectedParsed = parseLengthInput(problem.thirdZ);
            const isCorrect = inputParsed && expectedParsed && lengthsEqual(inputParsed, expectedParsed);
            if (isCorrect) {
                const thirdValue = `${ROLE_LABELS[problem.thirdRole]}=${problem.thirdZ}z`;
                problem.steps.third.value = thirdValue;
                problem.steps.third.done = true;
                problem.thirdError = false;
                setSessionPhase("answering");
                rerenderModernOnly();
                triggerFeedbackEffect("correct");
            } else {
                problem.wrongAttempts += 1;
                setSessionPhase("wrong_feedback");
                problem.thirdError = true;
                problem.thirdInput = "";
                if (problem.wrongAttempts >= 2) {
                    revealLocalHint();
                }
                rerenderModernOnly();
                triggerFeedbackEffect("wrong");
                requestAnimationFrame(() => {
                    const input = document.getElementById("guided-third-input");
                    if (input) input.focus();
                });
            }
        }

        function submitGuidedFinalStep() {
            noteInteraction();
            refreshAfterInteraction();
            const problem = currentProblem();
            if (problem.solved || !canAnswerCurrentProblem()) {
                return;
            }
            const num = problem.finalInputs.numerator.trim();
            const den = problem.finalInputs.denominator.trim();
            if (!num || !den) {
                return;
            }
            const expectedNum = problem.final.split("/")[0];
            const expectedDen = problem.final.split("/")[1];
            const numParsed = parseLengthInput(num);
