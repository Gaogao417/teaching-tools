            const denParsed = parseLengthInput(den);
            const expectedNumParsed = parseLengthInput(expectedNum);
            const expectedDenParsed = parseLengthInput(expectedDen);
            const isCorrect = numParsed && denParsed && expectedNumParsed && expectedDenParsed &&
                lengthsEqual(numParsed, expectedNumParsed) && lengthsEqual(denParsed, expectedDenParsed);
            if (isCorrect) {
                if (!problem.finalErrors) problem.finalErrors = { numerator: false, denominator: false };
                const finalValue = `${num}/${den}`;
                problem.steps.final.value = finalValue;
                problem.steps.final.done = true;
                problem.finalErrors.numerator = false;
                problem.finalErrors.denominator = false;
                recordProblemCompletion(problem);
                problem.solved = true;
                setSessionPhase("correct_pause");
                rerenderModernOnly();
                triggerFeedbackEffect("correct");
                advanceAfterSolve();
            } else {
                problem.wrongAttempts += 1;
                setSessionPhase("wrong_feedback");
                if (!problem.finalErrors) problem.finalErrors = { numerator: false, denominator: false };
                problem.finalErrors.numerator = !numParsed || !expectedNumParsed || !lengthsEqual(numParsed, expectedNumParsed);
                problem.finalErrors.denominator = !denParsed || !expectedDenParsed || !lengthsEqual(denParsed, expectedDenParsed);
                if (problem.finalErrors.numerator) {
                    problem.finalInputs.numerator = "";
                }
                if (problem.finalErrors.denominator) {
                    problem.finalInputs.denominator = "";
                }
                if (problem.wrongAttempts >= 2) {
                    revealLocalHint();
                }
                rerenderModernOnly();
                triggerFeedbackEffect("wrong");
                requestAnimationFrame(() => {
                    const targetId = problem.finalErrors.numerator ? "guided-final-top" : "guided-final-bottom";
                    const input = document.getElementById(targetId);
                    if (input) input.focus();
                });
            }
        }

        function resetGuidedCurrentStep() {
            const problem = currentProblem();
            const stepKey = currentGuidedStepKey(problem);
            if (stepKey === "mark") {
                problem.markTargets = { opposite: "", adjacent: "", hypotenuse: "" };
                problem.selectedKnownToken = null;
            } else if (stepKey === "ratio") {
                Object.keys(problem.ratioInputs).forEach((role) => {
                    problem.ratioInputs[role] = "";
                    problem.ratioErrors[role] = false;
                });
            } else if (stepKey === "third") {
                problem.thirdInput = "";
                problem.thirdError = false;
            } else if (stepKey === "final") {
                problem.finalInputs.numerator = "";
                problem.finalInputs.denominator = "";
                problem.finalErrors.numerator = false;
                problem.finalErrors.denominator = false;
            }
            setSessionPhase("answering");
            rerenderModernOnly();
        }

        function rerenderQuestionOnly() {
            rerenderModernOnly();
        }

        function checkRatioPlacement() {
            noteInteraction();
            refreshAfterInteraction();
            const problem = currentProblem();
            const allCorrect = Object.entries(problem.correctPlacement).every(([role, token]) => problem.targets[role] === token)
                && Object.entries(problem.targets).every(([role, token]) => !token || problem.correctPlacement[role] === token);
            if (allCorrect) {
                recordProblemCompletion(problem);
                problem.solved = true;
                setFeedback("good", "放置正确", `${problem.ratioText} 中的分子和分母已放到正确的边上。`);
                triggerFeedbackEffect("correct");
                advanceAfterSolve();
                return;
            }
            problem.wrongAttempts += 1;
            setFeedback("bad", "还需调整", `先看 ${problem.trig} A 需要哪两种边，再决定分子和分母应该放到哪里。`);
            triggerFeedbackEffect("wrong");
            if (problem.wrongAttempts >= 2) {
                revealLocalHint();
            }
        }

        function normalizeText(text) {
            return text.replace(/\s+/g, "").replace(/，/g, ",").replace(/：/g, "=").replace(/;/g, ",").toLowerCase();
        }

        function submitStep(stepKey) {
            noteInteraction();
            refreshAfterInteraction();
            const problem = currentProblem();
            if (problem.solved || !canAnswerCurrentProblem()) {
                return;
            }
            const input = document.querySelector(`[data-step-input="${stepKey}"]`);
            if (!input || input.disabled) {
                return;
            }
            const raw = input.value.trim();
            problem.steps[stepKey].value = raw;
            const ok = checkStep(problem, stepKey, raw);
            if (ok) {
                problem.steps[stepKey].done = true;
                rerenderQuestionOnly();
                const copy = stepKey === "mark"
                    ? "已正确标出已知边。"
                    : stepKey === "ratio"
                        ? "已写出正确的最简 z 比。"
                        : stepKey === "third"
                            ? "第三边系数填写正确。"
                            : `已得到 ${problem.target} A = ${problem.final}。`;
                setFeedback("good", "当前步骤正确", copy);
                triggerFeedbackEffect("correct");
                if (stepKey === "final") {
                    recordProblemCompletion(problem);
                    problem.solved = true;
                    setSessionPhase("correct_pause");
                    rerenderQuestionOnly();
                    setFeedback("good", "本题完成", `${problem.target} A = ${problem.final}，稍后自动进入下一题。`);
                    advanceAfterSolve();
                } else {
                    setSessionPhase("answering");
                }
            } else {
                problem.wrongAttempts += 1;
                setSessionPhase("wrong_feedback");
                rerenderQuestionOnly();
                const copy = stepKey === "mark"
                    ? "先把已知三角比里的两条边，与真实长度一一对应。"
                    : stepKey === "ratio"
                        ? "先把真实长度同时约去最大公因数，再写成若干个 z。"
                        : stepKey === "third"
                            ? "第三边需要基于前一步的 z 比，用勾股关系补出。"
                            : `最后一步需要把前面得到的 z 比代回 ${problem.target} A。`;
                setFeedback("bad", "当前步骤不正确", copy);
                triggerFeedbackEffect("wrong");
                if (problem.wrongAttempts >= 2) {
                    revealLocalHint();
                }
            }
        }

        function checkStep(problem, stepKey, raw) {
            const text = normalizeText(raw);
            const sortedActual = Object.entries(problem.actualKnown)
                .map(([role, value]) => `${ROLE_LABELS[role]}=${value}`)
                .sort()
                .join(",");
            const sortedZ = Object.entries(problem.zRoles)
                .map(([role, value]) => `${ROLE_LABELS[role]}=${value}z`)
                .sort()
                .join(",");
            const thirdExpected = `${ROLE_LABELS[problem.thirdRole]}=${problem.thirdZ}z`.toLowerCase();
            if (stepKey === "mark") {
                return normalizeText(sortedActual) === text;
            }
            if (stepKey === "ratio") {
                return normalizeText(sortedZ) === text;
            }
            if (stepKey === "third") {
                return normalizeText(thirdExpected) === text;
            }
            return text === normalizeText(problem.final);
        }

        function rerenderQuestionOnly() {
            rerenderModernOnly();
        }

        function executeAdvance() {
            if (!state.session) return;
            clearIdleWatch();
            clearPendingTimers();
            if (state.session.index < state.session.problems.length - 1) {
                setSessionPhase("answering");
                state.session.index += 1;
                const nextProblem = currentProblem();
                if (state.session.firstInteractionDone) {
                    ensureProblemStart(nextProblem);
                }
                renderPlayModern(nextProblem, state.session);
                startIdleWatch();
            } else {
                finishGroup();
            }
        }

        function advanceAfterSolve() {
            clearIdleWatch();
            clearPendingTimers();
            state.session.pendingAdvanceTimer = setTimeout(() => {
                executeAdvance();
                state.session.pendingAdvanceTimer = null;
            }, AUTO_ADVANCE_DELAY);
        }

        function bestForGroup(groupId) {
            const history = state.history[groupId] || [];
            return history.length ? Math.min(...history.map((item) => item.elapsedMs)) : null;
        }

        function avgForGroup(groupId) {
            const history = state.history[groupId] || [];
            return average(history.slice(-5).map((item) => item.elapsedMs));
        }

        function finishGroup() {
            const session = state.session;
            if (!session) {
                return;
            }
            stopTimer();
            clearIdleWatch();
            clearPendingTimers();
            if (session.startMs) {
                session.elapsedMs = Date.now() - session.startMs;
            }
            const previousEntry = state.history[session.groupId].length
                ? state.history[session.groupId][state.history[session.groupId].length - 1]
                : null;
            const firstTry = computeFirstTryAccuracy(session.problems);
            state.history[session.groupId].push({
                elapsedMs: session.elapsedMs,
                clearedAt: new Date().toISOString(),
                problemCount: session.problems.length,
                firstTryAccuracy: firstTry.ratio
            });
            saveState();
            setSessionPhase("group_finished");
            const bestMs = bestForGroup(session.groupId);
            const groupLabel = groupDisplayTitle(session.group.title);
            state.resultSnapshot = {
                groupId: session.groupId,
                title: `${groupOrderLabel(session.group.title)} 已完成`,
                groupLabel,
                elapsedMs: session.elapsedMs,
                bestMs,
                avgMs: avgForGroup(session.groupId),
                history: state.history[session.groupId],
                color: session.group.color,
                copy: `本次共完成 ${session.problems.length} 题，可查看详细结果与最近趋势。`,
                problemCount: session.problems.length,
                firstTryAccuracy: firstTry.ratio,
                firstTryCorrectCount: firstTry.correctCount,
                deltaVsPreviousMs: previousEntry ? session.elapsedMs - previousEntry.elapsedMs : null,
                isNewBest: Number.isFinite(bestMs) && session.elapsedMs <= bestMs,
                bestGapMs: Number.isFinite(bestMs) ? Math.max(0, session.elapsedMs - bestMs) : null,
                questionBreakdown: session.problems.map((problem, index) => ({
                    label: `Q${index + 1}`,
                    elapsedMs: Number.isFinite(problem.elapsedMs) ? problem.elapsedMs : 0,
                    firstTryCorrect: Boolean(problem.firstTryCorrect)
                })),
                nextGroupId: nextGroupId(session.groupId)
            };
            setFeedback("good", "本组已完成", "成绩面板即将展开，按 Enter 可立即查看。");
            session.pendingResultModalTimer = setTimeout(() => {
                openScoreModal(state.resultSnapshot);
                session.pendingResultModalTimer = null;
            }, RESULT_MODAL_DELAY);
            rerenderModernOnly();
            triggerFeedbackEffect("finish");
        }

        function showResultScreen(snapshot) {
            if (!snapshot) {
                return;
            }
            setSessionPhase("result_page");
            document.getElementById("result-title").textContent = snapshot.title;
            document.getElementById("result-copy").textContent = snapshot.copy;
            document.getElementById("result-time").textContent = formatSeconds(snapshot.elapsedMs);
            document.getElementById("result-best").textContent = formatSeconds(snapshot.bestMs);
            document.getElementById("result-avg").textContent = formatSeconds(snapshot.avgMs);
            document.getElementById("result-chart").innerHTML = buildChart(snapshot.history, snapshot.color);
            showScreen("result");
        }

        function resetCurrentGroup() {
            if (!state.session) {
                return;
            }
            stopTimer();
            clearIdleWatch();
            clearPendingTimers();
            closeScoreModal();
            startGroup(state.session.groupId);
        }

        function backHome() {
            stopTimer();
            clearIdleWatch();
            clearPendingTimers();
            closeScoreModal();
            showScreen("home");
            renderHome();
        }

        function handleGlobalEnter(event) {
            if (event.key !== "Enter" || !state.session) {
                return;
            }
            if (state.session.phase === "correct_pause" && state.session.pendingAdvanceTimer) {
                executeAdvance();
                state.session.pendingAdvanceTimer = null;
            }
            if (state.session.phase === "group_finished" && state.session.pendingResultModalTimer) {
                clearTimeout(state.session.pendingResultModalTimer);
                state.session.pendingResultModalTimer = null;
                openScoreModal(state.resultSnapshot);
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeAttr(value) {
            return escapeHtml(value || "");
        }

        document.getElementById("back-home-btn").addEventListener("click", backHome);
        document.getElementById("restart-group-btn").addEventListener("click", resetCurrentGroup);
        document.getElementById("retry-btn").addEventListener("click", () => {
            if (state.resultSnapshot) {
                startGroup(state.resultSnapshot.groupId);
            }
        });
        document.getElementById("home-from-result-btn").addEventListener("click", backHome);
        document.addEventListener("keydown", handleGlobalEnter);

        loadState();
        renderHome();
        showScreen("home");
    </script>
</body>
</html>
